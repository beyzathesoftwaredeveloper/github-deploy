---
# Secret — hassas bilgiler (CI/CD pipeline'dan inject edilir, git'e commit ETMEYİN!)
# Kullanım: kubectl apply -f 01-secrets.yaml
# Ya da: kubectl create secret generic mern-secrets \
#   --from-literal=ATLAS_URI="mongodb+srv://..." \
#   --from-literal=MONGO_USERNAME="admin" \
#   --from-literal=MONGO_PASSWORD="..." \
#   -n mern-app
apiVersion: v1
kind: Secret
metadata:
  name: mern-secrets
  namespace: mern-app
type: Opaque
stringData:
  # Bu değerleri CI/CD pipeline'da environment variable'lardan doldurun
  # ya da AWS Secrets Manager / Vault kullanın
  ATLAS_URI: "mongodb://admin:PASSWORD@mern-mongodb-service:27017/sample_training?authSource=admin"
  MONGO_USERNAME: "admin"
  MONGO_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
