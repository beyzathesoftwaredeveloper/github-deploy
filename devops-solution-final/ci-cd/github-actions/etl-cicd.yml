name: Python ETL CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "python-project/**"
      - "dockerfiles/Dockerfile.etl"
      - ".github/workflows/etl-cicd.yml"
  pull_request:
    paths:
      - "python-project/**"

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  EKS_CLUSTER_NAME: mern-eks-cluster
  K8S_NAMESPACE: mern-app

jobs:
  # ─── 1. Test ETL ─────────────────────────────────────────────────────────
  test-etl:
    name: Test Python ETL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "python-project/requirements.txt"

      - name: Install dependencies
        run: pip install -r python-project/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 python-project/ --max-line-length=120 --ignore=E501 || true

      - name: Run ETL script (smoke test)
        run: python python-project/ETL.py

  # ─── 2. Build & Push ETL Image ───────────────────────────────────────────
  build-push-etl:
    name: Build & Push ETL to ECR
    runs-on: ubuntu-latest
    needs: test-etl
    if: github.ref == 'refs/heads/main'
    outputs:
      short-sha: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ETL image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/Dockerfile.etl
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/python-etl:${{ steps.vars.outputs.sha_short }}
            ${{ env.ECR_REGISTRY }}/python-etl:latest

  # ─── 3. Update CronJob Image ─────────────────────────────────────────────
  deploy-etl:
    name: Update ETL CronJob
    runs-on: ubuntu-latest
    needs: build-push-etl
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Update CronJob with new image
        run: |
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/python-etl:${{ needs.build-push-etl.outputs.short-sha }}"
          kubectl set image cronjob/python-etl-cronjob \
            python-etl=${NEW_IMAGE} \
            -n ${{ env.K8S_NAMESPACE }}
          echo "CronJob updated with image: ${NEW_IMAGE}"

      - name: Trigger immediate test run
        run: |
          # Pipeline sonrası ETL'i bir kez manuel tetikle
          kubectl create job --from=cronjob/python-etl-cronjob \
            python-etl-test-$(date +%s) \
            -n ${{ env.K8S_NAMESPACE }}
