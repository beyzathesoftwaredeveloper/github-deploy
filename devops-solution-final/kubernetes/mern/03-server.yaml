---
# Express/Node.js Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-server
  namespace: mern-app
  labels:
    app: mern-server
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mern-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mern-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5050"
        prometheus.io/path: "/healthcheck"
    spec:
      # Pod anti-affinity: iki replica farklı node'larda olsun
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mern-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mern-server
          # GitHub Actions bu değeri image tag ile replace eder
          image: 686519987622.dkr.ecr.eu-central-1.amazonaws.com/mern-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          env:
            - name: ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: mern-secrets
                  key: ATLAS_URI
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: mern-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 5050
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
      terminationGracePeriodSeconds: 30

---
# Backend ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: mern-server-service
  namespace: mern-app
  labels:
    app: mern-server
spec:
  selector:
    app: mern-server
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050
  type: ClusterIP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mern-server-hpa
  namespace: mern-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mern-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
