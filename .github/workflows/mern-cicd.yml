name: MERN Stack CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  EKS_CLUSTER_NAME: mern-eks-cluster
  K8S_NAMESPACE: mern-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install client dependencies
        working-directory: devops-solution-final/mern-project/client
        run: npm ci || true

      - name: Install server dependencies
        working-directory: devops-solution-final/mern-project/server
        run: npm ci || true

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      short-sha: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: devops-solution-final
          file: devops-solution-final/dockerfiles/Dockerfile.server
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/mern-server:${{ steps.vars.outputs.sha_short }}
            ${{ env.ECR_REGISTRY }}/mern-server:latest

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: devops-solution-final
          file: devops-solution-final/dockerfiles/Dockerfile.client
          push: true
          build-args: |
            REACT_APP_SERVER_URL=${{ secrets.REACT_APP_SERVER_URL }}
          tags: |
            ${{ env.ECR_REGISTRY }}/mern-client:${{ steps.vars.outputs.sha_short }}
            ${{ env.ECR_REGISTRY }}/mern-client:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f devops-solution-final/kubernetes/mern/00-namespace.yaml
          kubectl apply -f devops-solution-final/kubernetes/mern/02-mongodb.yaml
          kubectl apply -f devops-solution-final/kubernetes/mern/03-server.yaml
          kubectl apply -f devops-solution-final/kubernetes/mern/04-client.yaml
          kubectl apply -f devops-solution-final/kubernetes/python-etl/cronjob.yaml

      - name: Update image tags
        run: |
          kubectl set image deployment/mern-server \
            mern-server=${{ env.ECR_REGISTRY }}/mern-server:${{ needs.build-and-push.outputs.short-sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/mern-client \
            mern-client=${{ env.ECR_REGISTRY }}/mern-client:${{ needs.build-and-push.outputs.short-sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mern-server -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/mern-client -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/mern-server -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/mern-client -n ${{ env.K8S_NAMESPACE }}
